# Builds the site and publishes it to GitHub Pages every time you push to
# your main branch (called "main" or "master", depending on your Git setup).
# You can also start it by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Lets this workflow publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, the newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the dist folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

